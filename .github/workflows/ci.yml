# Public repositories can use standard GitHub-hosted runners without consuming paid minutes.
name: CI

on:
  push:
    branches: [main, feature/postgresql-migration-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mzobs
          POSTGRES_PASSWORD: mzobs-ci-password
          POSTGRES_DB: mzobs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mzobs -d mzobs_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://mzobs:mzobs-ci-password@localhost:5432/mzobs_ci?schema=public"
      SQLITE_DATABASE_URL: "file:../ci-source.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate PostgreSQL Prisma schema
        run: npm run db:validate
      - name: Validate SQLite source schema
        run: npm run db:validate:sqlite
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Build application
        run: npm run build
